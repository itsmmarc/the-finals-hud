//======================================================================================================================================================================================================================
// On first HUD launch creates a fh folder inside tf/cfg
//======================================================================================================================================================================================================================
alias "fh_cfg_folder" "host_writeconfig finalshud_temporary_cfg_backup.cfg full; ds_dir cfg/fh; ds_log 0; ds_record; ds_stop; exec finalshud_temporary_cfg_backup.cfg"
fh_cfg_folder
//======================================================================================================================================================================================================================
// On first HUD launch creates a fh folder inside tf/custom
//======================================================================================================================================================================================================================
alias "fh_custom_folder" "host_writeconfig finalshud_temporary_cfg_backup.cfg full; ds_dir custom/fh; ds_log 0; ds_record; ds_stop; exec finalshud_temporary_cfg_backup.cfg"
fh_custom_folder

//======================================================================================================================================================================================================================
// Generates firstrun_complete.txt, stops the file from executing each time the game is launched
//======================================================================================================================================================================================================================
con_logfile		"cfg/fh/firstrun_complete.txt"
echo			"alias fh_firstrun"
con_logfile		"console.log"

//======================================================================================================================================================================================================================
// Extra HUD configuration
//======================================================================================================================================================================================================================
cl_hud_minmode 0
fh_reset
